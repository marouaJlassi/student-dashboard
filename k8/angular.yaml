apiVersion: apps/v1
kind: Deployment
metadata:
  name: schooldevops-deployment
  namespace: schooldevops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: schooldevops-deployment
  template:
    metadata:
      labels:
        app: schooldevops-deployment
    spec:
      containers:
        - name: schooldevops-deployment
          image: maroua256/student-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 85
---
apiVersion: v1
kind: Service
metadata:
  name: schooldevops-service
  namespace: schooldevops
  labels:
    name: schooldevops-deployment
spec:
  type: NodePort
  selector:
    app: schooldevops-deployment
  ports:
    - port: 85
      targetPort: 8089
      protocol: TCP

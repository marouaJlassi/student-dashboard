services:
  frontend:
    build: .
    ports:
      - '4301:8089'
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - --nginx.scrape-uri=http://frontend:8089/nginx_status
    ports:
      - '9115:9114'
    depends_on:
      - frontend
    restart: unless-stopped